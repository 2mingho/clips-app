<!doctype html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Clips · Conectando TikTok</title>
<style>
  body { margin: 0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #15181d; }
  @media (prefers-color-scheme: dark) { body { background: #111317; color: #e9ebee; } }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
</style>
</head>
<body>
<main>
  <h1>Conectando TikTok…</h1>
  <p id="m">Volviendo al panel privado.</p>
</main>
<script>
  // Puente de la conexión con TikTok: TikTok exige una dirección https de vuelta y el panel es privado.
  // Esta página solo reenvía el código de autorización al panel indicado en «state», y únicamente si es uno de los
  // paneles autorizados. Se guardan sus huellas SHA-256, no las direcciones. No guarda ni envía nada a ningún otro sitio.
  (async function () {
    var HUELLAS = ["16663b985f54bd9862675ea9bb3c3a742fcddd5c03575da6a17d3723c23461d4","e701497f1beef4e99ffce4b05603db3af5f7f710a365d2269bab02ec9d03e13b","e0e9f236e7addfcc8adaa73edbcb033813c6de957a52d16552cfcf08f0a9e31f","fa630e4e2b5374a6426ec3ba356db311ef1dd5ba330729f95ae799d513d5ced4"];
    var q = new URLSearchParams(location.search);
    var state = q.get('state') || '';
    var origen = '';
    try { origen = atob((state.split('.')[1] || '').replace(/-/g, '+').replace(/_/g, '/')); } catch (e) {}
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(origen));
    var h = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    if (!origen || HUELLAS.indexOf(h) === -1) { document.getElementById('m').textContent = 'Enlace no válido.'; return; }
    location.replace(origen + '/api/tiktok/callback' + location.search);
  })();
</script>
</body>
</html>
